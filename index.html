.dnav{display:none;gap:4px;margin-left:12px}

.dnav button.on{background:var(--blue-soft);color:var(--blue-deep)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.coinchip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.coin{width:16px;height:16px;border-radius:50%;background:var(--coin);display:inline-block;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue-deep);font-weight:700;font-size:13px;display:grid;place-items:center;border:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);min-height:44px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* mobile tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:10px}

main{padding-block:24px 110px;display:flex;flex-direction:column;gap:40px}
section{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}

.skill p{color:var(--muted);font-size:14px}

.tab{padding:9px 14px;border-radius:999px;font-weight:700;border:1px solid var(--line);background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.tab.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}

.fb.no{background:var(--bad-soft);color:var(--bad)}

.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}

.au-err{min-height:18px;color:var(--bad);font-size:14px;font-weight:600}

.au-sw{display:block;width:100%;margin-top:14px;background:none;border:0;color:var(--muted);font:inherit;padding:10px;cursor:pointer}
.au-sw b{color:var(--blue)}
.au-note{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 0}
.greet{font:800 22px var(--display);margin:6px 0 14px}

@media(prefers-reduced-motion:reduce){#auth,.au-card,.au-in{transition:none;animation:none}}
</style>

  if(window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}

  speechSynthesis.speak(u);
 },
 showtext:function(t){showText[t.dataset.k]=!showText[t.dataset.k];render();},
 check:function(){
  var el=document.getElementById("wtxt");wText=el.value;var txt=wText.trim();
  if(!txt){toast("Avval matn yozing.");return;}
  var i=IDX["w"+S.level]||0,w=WRITE[S.level][i][1],key="w-"+S.level+"-"+i;
  var words=txt.split(/\s+/),n=words.length;
  var sents=txt.split(/[.!?]+/).filter(function(x){return x.trim();}).length||1;
  var uniq=new Set(words.map(function(x){return x.toLowerCase().replace(/[^a-z']/g,"");})).size;
  var avg=n/sents;
  wRes=[
   [n>=w,"Hajm: "+n+" ta soʻz"+(n>=w?" (maqsad bajarildi)":" (maqsad "+w+" ta)")],
   [avg>=6&&avg<=25,"Gap uzunligi: oʻrtacha "+avg.toFixed(1)+" ta soʻz"+(avg<6?". Gaplarni choʻzing.":avg>25?". Gaplarni qisqartiring.":".")],
   [uniq/n>=.55,"Soʻz xilma-xilligi: "+Math.round(uniq/n*100)+"%"+(uniq/n<.55?". Takrorlarni kamaytiring.":".")],
   [!/\bi\b/.test(txt),/\bi\b/.test(txt)?"Kichik harfli \"i\" topildi. \"I\" katta yoziladi.":"Katta harf qoidasi saqlangan."],
   [/^[A-Z]/.test(txt),/^[A-Z]/.test(txt)?"Matn katta harf bilan boshlangan.":"Matnni katta harf bilan boshlang."]
  ];
  if(n>=w&&!S.done[key]){S.done[key]=1;addCoins(1);save();toast("+1 coin: Writing topshirigʻi bajarildi");}
  else if(n<w)toast("Yana "+(w-n)+" ta soʻz yozing.");
  render();
 },
 wnext:function(){
  var list=WRITE[S.level],i=((IDX["w"+S.level]||0)+1)%list.length;
  IDX["w"+S.level]=i;wText="";wRes=null;render();window.scrollTo(0,0);
 },
 timer:function(){
  if(tm.id){stopTimer();render();return;}
  if(tm.left<=0)tm.left=60;
  tm.id=setInterval(function(){tm.left--;var e=document.getElementById("timer");if(e)e.textContent=fmtT(tm.left);
   if(tm.left<=0){A.finishSpeak();}},1000);
  render();
 },
 finishSpeak:function(){
  stopTimer();
  var i=IDX["s"+S.level]||0,key="s-"+S.level+"-"+i;
  if(!S.done[key]){S.done[key]=1;addCoins(1);save();toast("+1 coin: Speaking mashqi bajarildi");}
  else toast("Bu mavzu avval bajarilgan");
  A.snext();
 },
 sdone:function(){
  if(60-tm.left<20){toast("Avval kamida 20 soniya gapiring. Taymerni boshlang.");return;}
  A.finishSpeak();
 },
 snext:function(){
  stopTimer();tm.left=60;
  var list=SPEAK[S.level];IDX["s"+S.level]=((IDX["s"+S.level]||0)+1)%list.length;
  render();window.scrollTo(0,0);
 },
 treset:function(){stopTimer();tm.left=60;render();},
 start:function(t){
  var id=t.dataset.v,dbl=false;
  Q={tier:id,i:0,score:0,earned:0,picked:null,hid:[],dbl:dbl};route="grammar";render();window.scrollTo(0,0);
 },
 pick:function(t){
  if(!Q||Q.picked!=null)return;var i=+t.dataset.i,it=GR[Q.tier][Q.i];Q.picked=i;
  if(i===it[2]){Q.score++;}
  render();
  var qq=Q,qi=Q.i;
  schedule(function(){if(Q===qq&&Q.i===qi&&Q.picked!=null)A.next();},i===it[2]?1100:2300);
 },
 next:function(){
  clearAuto();Q.i++;Q.picked=null;Q.hid=[];
  if(Q.i>=GR[Q.tier].length){var b=S.best[Q.tier];if(b==null||Q.score>b)S.best[Q.tier]=Q.score;save();}
  render();window.scrollTo(0,0);
 },
 fifty:function(){

 },
 quizexit:function(){clearAuto();Q=null;render();window.scrollTo(0,0);},
 buy:function(t){

  else S.premiumUntil=Math.max(Date.now(),S.premiumUntil)+1*864e5;
  save();render();toast(s.n+" sotib olindi");
 },

 profile:function(){go("profile");},

 },
 pfcode:function(){

 mclose:function(t,e){if(t.dataset.bg&&e.target!==t)return;M=null;render();},

/* ---------- Auth tizimi ----------
   AUTH_API boʻsh boʻlsa: hisoblar shu brauzerda saqlanadi (parol PBKDF2 bilan xeshlanadi).
   Backend ulash uchun AUTH_API ga server manzilini yozing (POST /register, /login, /me, /logout;
   javob: {user:{name,email}}; sessiya httpOnly cookie orqali). */
var AUTH_API="";
var UK="et_users_v2", SK="et_session_v2", gmode="register";
var MEM={};
function rd(k){try{var r=localStorage.getItem(k);if(r!==null)return JSON.parse(r);}catch(e){}return MEM[k]!==undefined?MEM[k]:null;}
function wr(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}return true;}
function hex(a){return Array.prototype.map.call(a,function(x){return ("0"+x.toString(16)).slice(-2);}).join("");}
function rnd(n){var a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return hex(a);}
function hashPw(pw,salt){
 if(window.crypto&&crypto.subtle&&window.TextEncoder){
  var e=new TextEncoder();
  return crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){
   return crypto.subtle.deriveBits({name:"PBKDF2",salt:e.encode(salt),iterations:150000,hash:"SHA-256"},k,256);
  }).then(function(b){return hex(new Uint8Array(b));}).catch(function(){return sha(salt+pw);});
 }
 return sha(salt+pw);
}
function api(path,body){return fetch(AUTH_API+path,{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d&&d.error||"Xatolik");return d;});});}
function greet(){var n=(S.name||"").trim().split(/\s+/)[0];return n?'<p class="greet">Salom, '+esc(n)+'! 👋</p>':"";}
function applyUser(u,quiet){
 S.name=u.name;S.acct={name:u.name,phone:u.email,email:u.email,ver:true};S.in=true;save();
 hideGate();render();if(!quiet)toast("Xush kelibsiz, "+u.name.split(/\s+/)[0]+"!");
}
function lockUI(on){["hdr","app","tabbar","modal"].forEach(function(id){var el=document.getElementById(id);if(el){if(on)el.setAttribute("inert","");else el.removeAttribute("inert");}});document.documentElement.classList.toggle("au-lock",on);}
function gateHTML(m){
 var reg=m==="register";
 return '<div class="au-bg"><span class="au-b1"></span><span class="au-b2"></span></div>'+
 '<div class="au-card" role="dialog" aria-modal="true" aria-labelledby="au-t"><div class="au-in">'+
 '<div class="au-logo"><span class="mark"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="5" height="7" rx="1"/><rect x="9.5" y="9" width="5" height="12" rx="1"/><rect x="16" y="3" width="5" height="18" rx="1"/></svg></span><span class="t">English Teach</span></div>'+
 '<h1 id="au-t">'+(reg?"English Teach’ga xush kelibsiz!":"Yana xush kelibsiz!")+'</h1>'+
 '<p class="au-sub">'+(reg?"Ingliz tilini oʻrganishni boshlash uchun roʻyxatdan oʻting":"Davom etish uchun hisobingizga kiring")+'</p>'+
 '<div class="au-f" id="au-f">'+
 (reg?'<div><label for="au-n">Ism</label><input id="au-n" type="text" maxlength="30" autocomplete="name" placeholder="Masalan, Akbarjon"></div>':'')+
 '<div><label for="au-e">Email</label><input id="au-e" type="email" autocomplete="email" inputmode="email" placeholder="siz@example.com"></div>'+
 '<div><label for="au-p">Parol</label><div class="au-pw"><input id="au-p" type="password" autocomplete="'+(reg?"new-password":"current-password")+'" placeholder="'+(reg?"Kamida 6 belgi":"Parolingiz")+'"><button type="button" class="au-eye" id="au-eye">Koʻrsatish</button></div></div>'+
 '<div class="au-err" id="au-er" role="alert"></div>'+
 '<button class="btn primary au-go" id="au-go" type="button">'+(reg?"Roʻyxatdan oʻtish":"Kirish")+'</button></div>'+
 '<button class="au-sw" id="au-sw" type="button">'+(reg?"Hisobingiz bormi? <b>Kirish</b>":"Hisobingiz yoʻqmi? <b>Roʻyxatdan oʻtish</b>")+'</button>'+
 '</div></div>';
}
function showGate(m){
 gmode=m;var g=document.getElementById("auth");
 g.innerHTML=gateHTML(m);g.hidden=false;lockUI(true);
 requestAnimationFrame(function(){g.classList.add("on");});
 var f=document.getElementById("au-f"),er=document.getElementById("au-er");
 document.getElementById("au-sw").onclick=function(){showGate(m==="register"?"login":"register");};
 document.getElementById("au-eye").onclick=function(){var p=document.getElementById("au-p"),h=p.type==="password";p.type=h?"text":"password";this.textContent=h?"Yashirish":"Koʻrsatish";};
 var submit=function(){
  var n=m==="register"?document.getElementById("au-n").value.trim():"",
      em=document.getElementById("au-e").value.trim().toLowerCase(),
      pw=document.getElementById("au-p").value,btn=document.getElementById("au-go");
  var msg="";
  if(m==="register"&&n.length<2)msg="Ismingizni kiriting (kamida 2 harf).";
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))msg="Toʻgʻri email kiriting.";
  else if(pw.length<6)msg="Parol kamida 6 belgidan iborat boʻlsin.";
  if(msg){er.textContent=msg;return;}
  er.textContent="";btn.disabled=true;var old=btn.textContent;btn.textContent="Kuting…";
  doAuth(m,n,em,pw).then(function(u){applyUser(u);}).catch(function(x){er.textContent=x&&x.message?x.message:"Xatolik yuz berdi.";btn.disabled=false;btn.textContent=old;});
 };
 document.getElementById("au-go").onclick=submit;
 f.onkeydown=function(ev){if(ev.key==="Enter"){ev.preventDefault();submit();}};
 setTimeout(function(){var i=document.getElementById(m==="register"?"au-n":"au-e");if(i)i.focus({preventScroll:true});},350);
}
function hideGate(){
 var g=document.getElementById("auth");g.classList.remove("on");lockUI(false);
 setTimeout(function(){if(!g.classList.contains("on")){g.hidden=true;g.innerHTML="";}},380);
}
function doAuth(m,n,em,pw){
 if(AUTH_API)return api(m==="register"?"/register":"/login",{name:n,email:em,password:pw}).then(function(d){return d.user;});
 var users=rd(UK)||{},u=users[em];
 if(m==="register"){
  if(u)return Promise.reject(new Error("Bu email bilan hisob mavjud. Kirish tugmasini bosing."));
  var salt=rnd(16);
  return hashPw(pw,salt).then(function(h){
   var nu={name:n,email:em,salt:salt,hash:h,created:Date.now()};users[em]=nu;
   if(!wr(UK,users))throw new Error("Brauzer xotirasiga yozib boʻlmadi.");
   wr(SK,{email:em,t:rnd(16)});return nu;
  });
 }
 if(!u)return Promise.reject(new Error("Email yoki parol notoʻgʻri."));
 return hashPw(pw,u.salt).then(function(h){if(h!==u.hash)throw new Error("Email yoki parol notoʻgʻri.");wr(SK,{email:em,t:rnd(16)});return u;});
}
function logout(){
 delete MEM[SK];try{localStorage.removeItem(SK);}catch(e){}
 if(AUTH_API)api("/logout").catch(function(){});
 S.in=false;save();route="home";try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
 render();window.scrollTo(0,0);showGate("login");
}
A.pfout=function(){logout();};
(function bootAuth(){
 if(AUTH_API){showGate("register");api("/me").then(function(d){applyUser(d.user,true);}).catch(function(){});return;}
 var ss=rd(SK),us=rd(UK)||{};
 if(ss&&us[ss.email]){S.name=us[ss.email].name;S.acct={name:S.name,phone:ss.email,email:ss.email,ver:true};S.in=true;save();return;}
 showGate(Object.keys(us).length?"login":"register");
})();

render();
})();
</script>
